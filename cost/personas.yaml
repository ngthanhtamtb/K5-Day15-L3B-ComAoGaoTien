# Mô phỏng chi phí khi dùng thật.
# Mọi số có nguồn (khảo sát n = 18 hợp lệ ở evidence/survey/results.csv; bảng giá BTC further-reading/model-prices.md) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 100       # số phiên mô phỏng (gấp đôi mức tối thiểu 50)
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản
                    # Người dùng của sản phẩm = người làm bài giảng (giảng viên, người soạn, biên tập), KHÔNG phải 700+ học viên.
  low: 5
  base: 8
  high: 20
  source: "Cơ sở 8: spec.md §2 'khoảng 5–8 giảng viên + đội sản xuất' (tự ước tính, chưa có số đếm thật). Thấp 5: cận dưới của khoảng đó. Cao 20: mở rộng sang nhiều bộ môn / đội sản xuất (tự ước tính)."

personas:           # share cộng lại = 1; tỉ lệ share và số lần dùng lấy từ câu 2 khảo sát (số bài kiểm / duyệt tháng vừa rồi, n = 18)
  - name: dung_it
    share: 0.33             # 6/18 phiếu kiểm 1–2 bài / tháng
    uses_per_month: 2       # trung điểm 1–2 bài, làm tròn lên
    turns_per_session: 2    # (tự ước tính) 1 lượt tạo quiz / slide + 1 lượt duyệt
    source: "Khảo sát câu 2: 6/18 phiếu hợp lệ kiểm 1–2 bài / tháng; số lượt mỗi phiên (tự ước tính)"
  - name: dung_vua
    share: 0.39             # 7/18 phiếu kiểm 3–5 bài / tháng
    uses_per_month: 4       # trung điểm 3–5 bài
    turns_per_session: 3    # (tự ước tính) tạo quiz, tạo slide, duyệt
    source: "Khảo sát câu 2: 7/18 phiếu hợp lệ kiểm 3–5 bài / tháng; số lượt mỗi phiên (tự ước tính)"
  - name: dung_nhieu
    share: 0.28             # 5/18 phiếu kiểm từ 6 bài / tháng trở lên
    uses_per_month: 8       # (tự ước tính) khảo sát chỉ cho 'từ 6 trở lên'
    turns_per_session: 4    # (tự ước tính) tạo, kiểm lại phần sửa ở cổng 2
    source: "Khảo sát câu 2: 5/18 phiếu hợp lệ kiểm ≥6 bài / tháng; 8 bài và số lượt mỗi phiên (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề (BTC xem 25/11/2026)
  - model: claude-haiku-5-5
    input: 0.10
    output: 0.50
    source: "https://platform.claude.com/docs/en/about-claude/pricing · Claude Haiku 5.5, giá cho prompt ≤100.000 token · xem 25/11/2026 (bảng BTC)"
  - model: claude-sonnet-5-5
    input: 2.00
    output: 10.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing · Claude Sonnet 5.5 · xem 25/11/2026 (bảng BTC)"
  - model: claude-opus-5-5
    input: 4.00
    output: 20.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing · Claude Opus 5.5 · xem 25/11/2026 (bảng BTC)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
